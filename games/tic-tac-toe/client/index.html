<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tic-Tac-Toe</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem;
           display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    #status { color: #555; min-height: 1.2em; }
    #board { display: grid; grid-template-columns: repeat(3, 80px); gap: 6px; }
    .cell { width: 80px; height: 80px; font-size: 2.5rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #889; background: #fff; cursor: pointer; }
    .cell[disabled] { cursor: default; color: #333; }
  </style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="board"></div>

  <script type="module">
    import { connect } from "./sdk.js";

    const MARKS = { 0: "X", 1: "O" };
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    let game = null;   // { cfg, sendAction } once connected

    function render(snap) {
      const mySeat = snap.your_seat;
      const finished = snap.phase === "finished";
      const myTurn = !finished && snap.current_player === mySeat;
      boardEl.innerHTML = "";
      snap.board.forEach((v, i) => {
        const b = document.createElement("button");
        b.className = "cell";
        b.textContent = v === null ? "" : MARKS[v];
        b.disabled = finished || v !== null || !myTurn || !game;
        b.addEventListener("click", () => game && game.sendAction("place", { cell: i }));
        boardEl.appendChild(b);
      });
      statusEl.textContent = finished
        ? (snap.winner === null ? "Draw." : (snap.winner === mySeat ? "You win!" : "You lose."))
        : (myTurn ? `Your move (${MARKS[mySeat]}).` : "Opponent's move…");
    }

    // Live updates arrive via onState (opponent's moves included — no refresh).
    connect({ onState: render }).then((g) => { game = g; });
  </script>
</body>
</html>
