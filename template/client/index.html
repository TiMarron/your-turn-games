<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Game</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem;
           display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    button { font-size: 1rem; padding: .6rem 1.2rem; cursor: pointer; }
    #status { color: #666; }
  </style>
</head>
<body>
  <div id="status">connecting…</div>
  <button id="go" disabled>Go</button>
  <script>
    // Starter client. Replace rendering + actions with your game's UI.
    let cfg = null;
    function send(msg) { window.parent.postMessage(JSON.stringify(msg), "*"); }
    async function api(path, opts) {
      const res = await fetch(cfg.api_base + path, {
        ...opts,
        headers: { "Authorization": "Bearer " + cfg.token,
                   "Content-Type": "application/json", ...(opts && opts.headers) } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }
    const goBtn = document.getElementById("go");
    const statusEl = document.getElementById("status");
    function render(snap) {
      const finished = snap.phase === "finished";
      const myTurn = !finished && snap.current_player === snap.your_seat;
      goBtn.disabled = !myTurn;
      statusEl.textContent = finished
        ? (snap.winner === snap.your_seat ? "You win!" : "Game over.")
        : (myTurn ? "Your move." : "Waiting…");
      if (finished) send({ type: "game_ended",
                           winner_seat: snap.winner === null ? -1 : snap.winner });
    }
    async function refresh() { render(await api("/api/games/" + cfg.room_code + "/state")); }
    goBtn.addEventListener("click", async () => {
      try { render(await api("/api/games/" + cfg.room_code + "/action",
        { method: "POST", body: JSON.stringify({ type: "go", data: {} }) }));
      } catch (e) { statusEl.textContent = "error: " + e.message; }
    });
    window.addEventListener("message", async (e) => {
      let d = e.data;
      if (typeof d === "string") { try { d = JSON.parse(d); } catch { return; } }
      if (!d || d.type !== "init") return;
      cfg = { token: d.token, room_code: d.room_code, api_base: d.api_base };
      try { await refresh(); } catch (err) { statusEl.textContent = "init error: " + err.message; }
    });
    send({ type: "ready" });
  </script>
</body>
</html>
