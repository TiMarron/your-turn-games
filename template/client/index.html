<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Game</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem;
           display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    button { font-size: 1rem; padding: .6rem 1.2rem; cursor: pointer; }
    #status { color: #666; }
  </style>
</head>
<body>
  <div id="status">connecting…</div>
  <button id="go" disabled>Go</button>
  <script type="module">
    // Starter client. Replace rendering + the action you send with your game's.
    import { connect } from "./sdk.js";

    const goBtn = document.getElementById("go");
    const statusEl = document.getElementById("status");
    let game = null;

    function render(snap) {
      const finished = snap.phase === "finished";
      const myTurn = !finished && snap.current_player === snap.your_seat;
      goBtn.disabled = !myTurn || !game;
      statusEl.textContent = finished
        ? (snap.winner === snap.your_seat ? "You win!" : "Game over.")
        : (myTurn ? "Your move." : "Waiting…");
    }

    goBtn.addEventListener("click", () => game && game.sendAction("go", {}));
    connect({ onState: render }).then((g) => { game = g; });
  </script>
</body>
</html>
