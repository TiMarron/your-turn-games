name: CI

on:
  pull_request:
  push:
    branches: [main]

# Fork PRs run with this read-only token and no secrets (GitHub withholds them
# on the `pull_request` trigger), so a malicious game.json build.command can't
# push code or exfiltrate credentials — worst case it wastes runner minutes.
# On push to main the DEPLOY_DISPATCH_TOKEN secret exists in the workflow, but
# GitHub only injects a secret into steps that reference it, so the unsandboxed
# build step in validate-games never sees it — only the notify-deploy job does.
# Repo setting "Require approval for all outside collaborators" (Settings →
# Actions → Fork pull request workflows) adds a human click before first-time
# contributors' workflows run at all. The authoritative gate for what reaches
# the platform is merge review + deploy_games.py on the deploy host.
permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run harness tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

  validate-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Reducers are validated in the sandbox; client builds run the game.json
      # build.command UNSANDBOXED on the runner. That's acceptable on PRs given
      # the read-only token / no secrets above, and it gives contributors the
      # "does my client even build?" signal before review instead of at deploy.
      - name: Install harness dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate reducers and build clients
        run: |
          set -e
          for dir in games/*/; do
            [ -f "$dir/game.json" ] || continue
            echo "=== $dir ==="
            python -m harness --validate --game "$dir"

            cmd=$(python -c "import json,sys; print(json.load(open(sys.argv[1])).get('build',{}).get('command',''))" "$dir/game.json")
            if [ -z "$cmd" ]; then
              # Static client: must ship a ready index.html.
              [ -f "$dir/client/index.html" ] || { echo "static client/index.html missing"; exit 1; }
              continue
            fi

            out=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['build']['output'])" "$dir/game.json")
            if [ -z "$out" ]; then
              echo "build manifest has 'command' but no 'output'"; exit 1
            fi

            echo "-> building client: $cmd"
            ( cd "$dir" && eval "$cmd" )
            [ -d "$dir/$out" ] || { echo "build output '$out' missing"; exit 1; }
            [ -f "$dir/$out/index.html" ] || { echo "build output '$out/index.html' missing"; exit 1; }
          done

  notify-deploy:
    needs: [harness-tests, validate-games]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Tells your-turn's deploy workflow a game was merged, so it delivers
      # it without waiting for the next push to your-turn itself. The default
      # GITHUB_TOKEN can't dispatch across repos, so this needs a PAT on
      # TiMarron/your-turn: fine-grained with `Contents: Read and write`, or
      # classic with the `repo` scope.
      - name: Dispatch games-updated to your-turn
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: gh api repos/TiMarron/your-turn/dispatches -f event_type=games-updated
